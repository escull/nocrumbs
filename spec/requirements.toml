n = 1
text = "From launch to any nested folder requires only typing + Enter (+Tab), no mouse, including after using a filter"
requires = ["BAR-03", "CMP-05", "CMP-12", "FLT-04"]

[[acceptance]]
n = 2
text = "Ghost text never alters typed characters; Backspace on ghost deletes it without re-offering; the first keystroke after focusing the bar replaces all"
requires = ["CMP-02", "CMP-06", "KEY-02"]

[[acceptance]]
n = 3
text = "Typing a partial name highlights the matching row in the same frame; Tab on a directory offers the next level immediately"
requires = ["CMP-03", "CMP-05"]

[[acceptance]]
n = 4
text = "Alias, filter, command and path input are disambiguated deterministically, with a visible mode chip"
requires = ["BAR-01", "VIS-03"]

[[acceptance]]
n = 5
text = "Command arguments (:mkdir \"a b\", :alias p ~/x, :cd C:\\Windows) can be typed in full without placeholder interference"
requires = ["CMP-09", "CMD-15", "CMD-16", "BAR-05"]

[[acceptance]]
n = 6
text = "Every command in section 8 works; every key in section 10 works; nothing panics on invalid input (fuzz-tested parser)"
requires = [
  "CMD-01", "CMD-02", "CMD-03", "CMD-04", "CMD-05", "CMD-06", "CMD-07", "CMD-08", "CMD-09", "CMD-10",
  "CMD-11", "CMD-12", "CMD-13", "CMD-14", "CMD-17", "FUZ-01",
  "KEY-01", "KEY-02", "KEY-03", "KEY-04", "KEY-05", "KEY-06", "KEY-07", "KEY-08", "KEY-09", "KEY-10",
]

[[acceptance]]
n = 7
text = "Sorting is stable, folders-first, and survives filter and hidden toggles"
requires = ["CMD-01", "SRT-01", "FLT-05"]

[[acceptance]]
n = 8
text = "Cut/paste across folders moves the item; collisions auto-rename; moving a folder into itself is rejected; the clipboard interoperates with Explorer in both directions"
requires = ["CLP-01", "CLP-02", "CLP-03", "CLP-07"]

[[acceptance]]
n = 9
text = "Delete goes to the Recycle Bin and Ctrl+Z restores it"
requires = ["CMD-08", "UND-01", "TRS-01"]

[[acceptance]]
n = 10
text = "The current path is visible at all times (bar, status line, title)"
requires = ["VIS-02", "VIS-05"]

[[acceptance]]
