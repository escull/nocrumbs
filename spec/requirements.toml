requires = ["DST-05", "DST-06", "PRF-03", "PRF-06"]

[[acceptance]]
n = 12
text = "Behaviour in sections 4-10 is covered by automated keystroke-script tests against the core and the in-memory filesystem"
requires = ["TST-01", "TST-02"]
