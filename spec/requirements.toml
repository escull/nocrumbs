# NoCrumbs requirements: every requirement of DESIGN_BRIEF.md, with a stable ID and the tests
# that prove it. Checked by `cargo xtask spec`; the report is spec/COVERAGE.md.
#
# IDs are `AREA-NN` and are never renumbered or reused: retire a requirement by editing its
# text, not by deleting the id. A requirement is
#
#   implemented  built, and every test listed passes (needs at least one test)
#   partial      built in part; tests cover what is built, `note` says what is missing
#   manual       cannot be proven by an automated test (hardware, screen reader, a measurement);
#                `note` says how a human checks it
#   planned      not built yet; `milestone` says where it lands (ROADMAP.md)
#
# Tests are `file.rs::test_name` for integration tests (the file name is unique in the workspace)
# and `unit:module::tests::test_name` for unit tests.
#
# `[[acceptance]]` are the 12 acceptance criteria of brief section 15; each is met only when
# every requirement it lists is implemented.

version = 1

