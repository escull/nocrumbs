[workspace]
resolver = "3"
members = ["crates/*", "spikes/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/escull/nocrumbs"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Quick optimised builds for timing probes: `cargo test --profile perf ...`
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"
strip = false
